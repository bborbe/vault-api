# Parameterized BuildKit build Job.
#
# Rendered by hack/build-cluster.sh, which is called from
# `make build BUILD_TARGET=<kubectl-context>`; never applied by hand.
#
# This file lives outside k8s/ on purpose: k8s/Makefile applies every *.yaml
# under k8s/, so a template kept there would be adopted as deploy state.
#
# Template tokens:
#   __JOB_NAME__           Job name, derived from __TAG__ and sanitized for DNS
#   __REPO_URL__           git URL to clone
#   __REF__                git ref (branch, tag or commit) to build
#   __TAG__                image tag to push
#   __DOCKERFILE__         Dockerfile path inside the repository
#   __IMAGE__              target image repository, without tag
#   __PUSH__               "true" to push the built image
#   __PUSH_SECRET__        name of the dockerconfigjson secret to mount
#   __GIT_SECRET__         name of the generic secret holding the GitHub App
#                          credential (APP_ID, INSTALLATION_ID, PEM_KEY)
#   __MINT_IMAGE__         image that mints the App's installation token,
#                          pinned by digest
#   __MINT_PULL_SECRET__   dockerconfigjson secret that can pull __MINT_IMAGE__
#   __NODE_SELECTOR__      flow-form nodeSelector; the whole line is deleted when
#                          the token renders empty, so a cluster with no pinned
#                          node is not left with an unschedulable Job
#   __DEADLINE_SECONDS__   Job deadline in seconds
#   __SOURCE_DATE_EPOCH__  commit timestamp, decimal seconds
#   __DOCKER_REGISTRY__    registry passed to the Dockerfile as a build arg
#
# Prerequisites (not created by this manifest): a kubernetes.io/dockerconfigjson
# secret in the build namespace, named by __PUSH_SECRET__, holding a credential
# that may push to the target registry; and an Opaque secret named by
# __GIT_SECRET__ carrying APP_ID, INSTALLATION_ID and PEM_KEY for a GitHub App
# installed on the repository.
apiVersion: batch/v1
kind: Job
metadata:
  name: __JOB_NAME__
  namespace: __NAMESPACE__
  labels:
    app.kubernetes.io/name: image-build
    app.kubernetes.io/component: build
    app.kubernetes.io/version: "__TAG__"
spec:
  backoffLimit: 0
  activeDeadlineSeconds: __DEADLINE_SECONDS__
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: image-build
        app.kubernetes.io/component: build
        app.kubernetes.io/version: "__TAG__"
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      # Two credentials, because the two registries differ: the mint image is
      # served from the private nuke registry, while the built image is pushed
      # to docker.io. A single pull secret covers only the one whose host it
      # names, so the pod carries both and the kubelet tries each in order.
      imagePullSecrets:
        - name: __MINT_PULL_SECRET__
        - name: __PUSH_SECRET__
      # sun's master carries no taint and only 4 CPU / 4 GiB, so an unpinned
      # build Job lands on the control plane; the worker is the build node.
      nodeSelector: __NODE_SELECTOR__
      initContainers:
        # Mints a GitHub App installation token into a shared emptyDir before
        # the clone runs. vault-api is a private repository, so the anonymous
        # clone every public repo in the fleet uses fails here with
        # `could not read Username for 'https://github.com'`.
        #
        # The token is redirected straight into a file: it must never reach the
        # container log, and the credential helper below reads it from there.
        - name: mint-token
          image: __MINT_IMAGE__
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              /main > /token/token
          env:
            # The two IDs come from the secret rather than from render time, so
            # the manifest carries no credential and a rotated App needs no
            # re-render. The PEM is a file, so it is mounted rather than passed
            # as an env var.
            - name: APP_ID
              valueFrom:
                secretKeyRef:
                  name: __GIT_SECRET__
                  key: APP_ID
            - name: INSTALLATION_ID
              valueFrom:
                secretKeyRef:
                  name: __GIT_SECRET__
                  key: INSTALLATION_ID
            - name: PEM_KEY_FILE
              value: /git-credential/PEM_KEY
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: git-credential
              mountPath: /git-credential
              readOnly: true
            - name: token
              mountPath: /token
        - name: clone
          image: alpine/git:v2.54.0@sha256:e8ceedc73bd80992ae8d58a7d24c58b8322146c354f1d2e81a97db4452068ec0
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              git init -q /src
              git -C /src remote add origin "$1"
              git -C /src fetch -q --depth=1 --tags origin "$2"
              git -C /src checkout -q --detach FETCH_HEAD
              git -C /src log -1 --format=%ct > /meta/source-date-epoch
              git -C /src log -1 --format=%cI > /meta/source-date-iso
              git -C /src rev-parse --short HEAD > /meta/git-commit
              git -C /src describe --tags --always --dirty > /meta/git-version
              echo "cloned $1 at $2: $(git -C /src rev-parse HEAD) epoch=$(cat /meta/source-date-epoch) version=$(cat /meta/git-version)"
            - clone
            - "__REPO_URL__"
            - "__REF__"
          env:
            # COUNT must stay one ahead of the KEY_/VALUE_ pairs below: git reads
            # exactly GIT_CONFIG_COUNT entries, so adding a pair without
            # bumping it silently drops that pair and the fetch fails exactly
            # as it did before the credential existed.
            - name: GIT_CONFIG_COUNT
              value: "2"
            - name: GIT_CONFIG_KEY_0
              value: safe.directory
            - name: GIT_CONFIG_VALUE_0
              value: /src
            # The helper, not an inline URL: a token in the remote URL leaks
            # through `git remote -v`, the rendered manifest and the clone log.
            - name: GIT_CONFIG_KEY_1
              value: credential.helper
            - name: GIT_CONFIG_VALUE_1
              value: "!f() { echo username=x-access-token; echo \"password=$(cat /token/token)\"; }; f"
          # Memory requests are deliberately small: the build node runs at ~98%
          # of its request capacity, and a pod asking for a GiB of scheduling
          # headroom to do a few hundred MiB of work never schedules there.
          # The limits are the real constraint; a request is only a hint.
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 1Gi
          # Hardened like any other container: the clone needs to write /src and
          # /meta and nothing else, so it keeps no capability and cannot escalate.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: src
              mountPath: /src
            - name: meta
              mountPath: /meta
            # Read-only: the token is produced by mint-token, never by clone.
            - name: token
              mountPath: /token
              readOnly: true
        # This repo builds with `-mod=vendor` while /vendor/ is gitignored, so the
        # clone carries no vendor directory. The local arm regenerates it through
        # `check-go-mod` before `docker build`; the cluster arm must do the same
        # here, or `go build -mod=vendor` fails on an empty vendor/modules.txt.
        - name: vendor
          image: golang:1.27.4
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              cd /src
              go mod vendor
          resources:
            requests:
              cpu: 200m
              memory: 128Mi
            limits:
              cpu: "2"
              memory: 2Gi
          # Same hardening as the clone: `go mod vendor` writes /src and the
          # module cache, and needs no capability to do it.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: src
              mountPath: /src
      containers:
        - name: build
          image: moby/buildkit:v0.34.1-rootless@sha256:f68752a5a94acfcdad2d07867b7075601a421638e17fc5f28efc1c814d0c4f89
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              cloned_epoch="$(cat /meta/source-date-epoch)"
              if [ "${cloned_epoch}" != "__SOURCE_DATE_EPOCH__" ]; then
                echo "REF __REF__ is commit epoch ${cloned_epoch} in the cluster but __SOURCE_DATE_EPOCH__ in the local repository; run git fetch and retry" >&2
                exit 1
              fi
              buildctl-daemonless.sh build \
                --frontend dockerfile.v0 \
                --local context=/src \
                --local dockerfile=/src \
                --opt filename=__DOCKERFILE__ \
                --opt platform=linux/amd64 \
                --opt build-arg:SOURCE_DATE_EPOCH=__SOURCE_DATE_EPOCH__ \
                --opt build-arg:BUILD_GIT_VERSION="$(cat /meta/git-version)" \
                --opt build-arg:BUILD_GIT_COMMIT="$(cat /meta/git-commit)" \
                --opt build-arg:BUILD_DATE="$(cat /meta/source-date-iso)" \
                --opt build-arg:DOCKER_REGISTRY=__DOCKER_REGISTRY__ \
                --metadata-file /meta/metadata.json \
                --output type=image,name=__IMAGE__:__TAG__,push=__PUSH__,rewrite-timestamp=true
              cat /meta/metadata.json
          env:
            - name: BUILDKITD_FLAGS
              value: "--oci-worker-no-process-sandbox"
            - name: DOCKER_CONFIG
              value: "/docker-config"
          # Unconfined here is deliberate and is NOT an oversight left over from
          # the init containers above: rootless buildkitd with
          # --oci-worker-no-process-sandbox needs both profiles relaxed to run
          # nested containers. Tightening them breaks every build; the
          # unprivileged uid and the dropped capabilities are the boundary.
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: Unconfined
            appArmorProfile:
              type: Unconfined
          resources:
            requests:
              cpu: 500m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: src
              mountPath: /src
            - name: meta
              mountPath: /meta
            # Container-internal path, not a host path: rootless buildkitd writes its
            # state to $HOME/.local/share/buildkit inside the image, and needs it
            # writable. Not a self-containment violation.
            - name: buildkitd
              mountPath: /home/user/.local/share/buildkit
            - name: docker-config
              mountPath: /docker-config
              readOnly: true
      volumes:
        - name: src
          emptyDir: {}
        - name: meta
          emptyDir: {}
        - name: buildkitd
          emptyDir: {}
        - name: token
          emptyDir: {}
        - name: git-credential
          secret:
            secretName: __GIT_SECRET__
            items:
              - key: PEM_KEY
                path: PEM_KEY
        - name: docker-config
          secret:
            secretName: __PUSH_SECRET__
            items:
              - key: .dockerconfigjson
                path: config.json
